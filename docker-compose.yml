name: gemini-web2api-rust

services:
  gemini-web2api:
    build: .
    image: gemini-web2api-rust
    container_name: gemini-web2api-rust
    ports:
      - "8082:8081"
    volumes:
      # Mount your own config (optional). Remove if you want the image default.
      - ./config.json:/app/config.json
      # Mount a cookie file for Pro routing (optional).
      # - ./cookie.txt:/app/cookie.txt
    restart: unless-stopped
    # If you get empty responses (content: null) on Docker's default bridge
    # network, Gemini may be rejecting the NAT IP range. Switch to host
    # networking by uncommenting the line below (Linux only) and removing
    # the `ports:` mapping above.
    # network_mode: host
