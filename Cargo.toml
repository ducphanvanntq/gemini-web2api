[package]
name = "gemini-web2api"
version = "1.1.0"
edition = "2021"
description = "Convert Google Gemini web into OpenAI-compatible API (Rust port)"
license = "MIT"

[[bin]]
name = "gemini-web2api"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
axum = "0.8"
reqwest = { version = "0.12", features = ["stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
sha1 = "0.10"
hex = "0.4"
clap = { version = "4", features = ["derive"] }
uuid = { version = "1", features = ["v4"] }
futures = "0.3"
async-stream = "0.3"
tower-http = { version = "0.6", features = ["cors"] }
once_cell = "1"
form_urlencoded = "1"

[profile.release]
opt-level = 3
lto = true
